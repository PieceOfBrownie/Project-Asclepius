<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShroomFit - Health</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="mySidepanel" class="sidepanel">
    <button type="button" class="closebtn" onclick="closeNav()" aria-label="Close menu">&times;</button>
    
    <a href="index.html"><img class="button-icons" src="icons/Home.png" alt="Home icon image">Home</a>
    <a href="health.html"><img class="button-icons" src="icons/Health.png" alt="Health icon image">Health</a>
    <a href="routine.html"><img img class="button-icons" src="icons/Routine.png" alt="Routine icon image">Routine</a>
    <a href="garden.html"><img class="button-icons" src="icons/Garden.png" alt="Garden icon image">Garden</a>
    <a href="friends.html"><img class="button-icons" src="icons/Friends-Ranking-Profile.png" alt="Friends/Ranking/Profile icon image">Friends</a>
    <!-- <a href="ranking.html">Ranking</a> -->
    <a href="exercices.html"><img img class="button-icons" src="icons/Exercises.png" alt="Exercises icon image">Exercises</a>
  </div>

  <div id="main">
    <button class="openbtn" onclick="openNav()">☰</button>
  </div>

  <header class="topbar">
    <h1>Health</h1>
  </header>

  <main>
    <p>Track how your health improves as you practice.</p>
    <div class="list">
      <div class="card"><span>Overall improvement</span><strong>+12%</strong></div>
      <div class="card"><span>Focus</span><strong>Getting started</strong></div>
      <div class="card"><span>Well-being goal</span><strong>In progress</strong></div>
    </div>
    <button class="primary">Update health check-in</button>
  </main>

  <div id="healthForm">
    <h2>A small quiz to check on your health! :)</h2><br>
    <form action="">
      <label for="pseudonym">How do you like to be referred as?</label><br>
      <input type="text" id=pseudonym" name="pseudonym"><br>
      
      <label for="howManyHours">How many hours on average do you sleep?</label><br>
      <select id="howManyHours" name="hours">
        <option value="4-6">4-6</option>
        <option value="6-8">6-8</option>
        <option value="8-10">8-10</option>
      </select><br>

      <label for="eatingHabits">Do you usually eat proper meals?</label><br>
      <input type="radio" id="eatGood" name="eatingHabits">
      <label for="eatGood">I do.</label>
      <input type="radio" id="eatBad" name="eatingHabits">
      <label for="eatBad">I do not.</label><br>

      <label for="restingFrequency">How often do you allow yourself to fully relax?</label><br>
      <select id="restingFrequency" name="frequency ">
        <option value="never">Never</option>
        <option value="everyWeek">Every week</option>
        <option value="everyDay">Every day</option>
      </select><br>
      <input type="submit" value="Finish Quiz">
    </form>

    <div>
      <p id="verdict"></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
