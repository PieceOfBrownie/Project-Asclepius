<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShroomFit - Home</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="mySidepanel" class="sidepanel">
    <button type="button" class="closebtn" onclick="closeNav()" aria-label="Close menu">&times;</button>
    <a href="index.html">🏠 Home</a>
    <a href="health.html">❤️ Health</a>
    <a href="routine.html">📋 Routine</a>
    <a href="garden.html">🍄 Garden</a>
    <a href="friends.html">👥 Friends</a>
    <a href="ranking.html">🏆 Ranking</a>
    <a href="exercices.html">💪 Exercises</a>
  </div>

  <div id="main">
    <button class="openbtn" onclick="openNav()">☰</button>
  </div>

  <main class="home">
    <section class="home-content">
      <img id="mushroom-image" src="mushroom_small.png" alt="Mushroom (Placeholder)" class="mushroom">
      <button class="start" onclick="window.location.href='exercices.html'">START</button>
      <section class="stats" aria-label="Progress">
        <div class="stat">
          <label for="streak">Streak 🔥</label>
          <progress id="streak" value="13" max="25"></progress>
        </div>
        <div class="stat">
          <label for="xp">XP ⭐</label>
          <progress id="xp" value="7" max="10"></progress>
        </div>
      </section>
    </section>
  </main>

  
  <script src="script.js"></script>

  <script>
    const mushroomImage = document.getElementById("mushroom-image");
    const growthStage = localStorage.getItem("mushroomStage");

    if (growthStage === "2") {
        mushroomImage.src = "mushroom_medium.png";
    }
  </script>

</body>
</html>
