<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShroomFit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>  

  <div id="mySidepanel" class="sidepanel">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="#">📋 Routine</a>
    <a href="#">❤️ Health</a>
    <a href="index.html">🏠 Home</a>
    <a href="garden.html">🍄 Garden</a>
    <a href="friends.html">👥 Friends</a>
    <a href="ranking.html">🏆 Ranking</a>
  </div>

  <div id="main">
    <button class="openbtn" onclick="openNav()">☰</button>
  </div>

  <main class="home">
    <section class="stats" aria-label="Progress">
      <div class="stat">
        <label for="streak">Streak 🔥</label>
        <progress id="streak" value="0" max="25"></progress>
      </div>
      <div class="stat">
        <label for="xp">XP ⭐</label>
        <progress id="xp" value="7" max="10"></progress>
      </div>
    </section>

    <section class="home-content">
      <img src="mushroom (placeholder).png" alt="Mushroom (Placeholder)" class="mushroom">
      <button class="start">START</button>
    </section>
  </main>

    <button data-target="health">❤️<span>Health</span></button>
    <button data-target="home" class="active">🏠<span>Home</span></button>
    <button data-target="garden">🍄<span>Garden</span></button>
    <button data-target="ranking">🏆<span>Ranking</span></button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
