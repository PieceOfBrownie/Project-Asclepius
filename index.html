<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShroomFit - Home</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="mySidepanel" class="sidepanel">
    <button type="button" class="closebtn" onclick="closeNav()" aria-label="Close menu">&times;</button>
    
    <a href="index.html"><img class="button-icons" src="icons/Home.png" alt="Home icon image">Home</a>
    <a href="health.html"><img class="button-icons" src="icons/Health.png" alt="Health icon image">Health</a>
    <a href="routine.html"><img img class="button-icons" src="icons/Routine.png" alt="Routine icon image">Routine</a>
    <a href="garden.html"><img class="button-icons" src="icons/Garden.png" alt="Garden icon image">Garden</a>
    <a href="friends.html"><img class="button-icons" src="icons/Friends-Ranking-Profile.png" alt="Friends/Ranking/Profile icon image">Friends</a>
    <!-- <a href="ranking.html">Ranking</a> -->
    <a href="exercices.html"><img img class="button-icons" src="icons/Exercises.png" alt="Exercises icon image">Exercises</a>
  </div>
  
  <div id="bg-image">
    <img class="bg-image" src="icons/ground.png" alt="background for mushroom">
  </div>

  <div id="main">
    <button class="openbtn" onclick="openNav()">☰</button>
  </div>

  <main class="home">
    <section class="home-content">
      <img id="mushroom-image" class="mushroom" src="images/mushroom_small.png" alt="Mushroom (Placeholder)" >
      <button class="start" onclick="window.location.href='exercices.html'">START</button>
      <section class="stats" aria-label="Progress">
        <div class="stat">
          <label for="streak">Streak 🔥</label>
          <progress id="streak" value="13" max="25"></progress>
        </div>
        <div class="stat">
          <label for="xp">XP ⭐</label>
          <progress id="xp" value="7" max="10"></progress>
        </div>
      </section>
    </section>
  </main>

  
  <script src="script.js"></script>

  <button id="reset-mushroom" onclick="resetMushroom()">Add mushroom to garden and plant a new one</button>
  <script>
  function resetMushroom() {
    localStorage.removeItem("mushroomStage");
    location.reload();
    }
  </script>
  <script>
    const mushroomImage = document.getElementById("mushroom-image");
    const growthStage = Number(localStorage.getItem("mushroomStage")) || 1;

    if (growthStage >= 3) {
        mushroomImage.src = "images/mushroom_large.png";
    } else if (growthStage >= 2) {
        mushroomImage.src = "images/mushroom_medium.png";
    } else {
        mushroomImage.src = "images/mushroom_small.png";
    }
</script>

</body>
</html>
