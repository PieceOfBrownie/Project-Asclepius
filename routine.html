<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShroomFit - Routine</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="mySidepanel" class="sidepanel">
    <button type="button" class="closebtn" onclick="closeNav()" aria-label="Close menu">&times;</button>
    
    <a href="index.html"><img class="button-icons" src="icons/Home.png" alt="Home icon image">Home</a>
    <a href="profile.html">👤 Profile</a>
    <a href="health.html"><img class="button-icons" src="icons/Health.png" alt="Health icon image">Health</a>
    <a href="routine.html"><img img class="button-icons" src="icons/Routine.png" alt="Routine icon image">Routine</a>
    <a href="garden.html"><img class="button-icons" src="icons/Garden.png" alt="Garden icon image">Garden</a>
    <a href="friends.html"><img class="button-icons" src="icons/Friends-Ranking-Profile.png" alt="Friends/Ranking/Profile icon image">Friends</a>
    <!-- <a href="ranking.html">Ranking</a> -->
    <a href="exercices.html"><img img class="button-icons" src="icons/Exercises.png" alt="Exercises icon image">Exercises</a>
  </div>

  <div id="main">
    <button class="openbtn" onclick="openNav()">☰</button>
  </div>

  <header class="topbar">
    <h1>Routine</h1>
  </header>

  <main>
    <p>Plan how much you want to practice today.</p>
    <div class="list">
      <div class="card"><span>Practice goal</span><strong>20 minutes</strong></div>
      <div class="card"><span>Completed today</span><strong id="practice-completed">0 minutes</strong></div>
      <div class="card"><span>Next session</span><strong>Not scheduled</strong></div>
    </div>
    <button class="primary">+ Add practice session</button>
  </main>

  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById("practice-completed").textContent =
      `${getProfile().practiceMinutes} minutes`;
  </script>
</body>
</html>
