<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShroomFit - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="auth-card">
    <div class="auth-icon">🍄</div>
    <h1>Welcome to ShroomFit</h1>
    <p>Sign in to keep your practice progress growing.</p>

    <form id="login-form" class="auth-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="demo@shroomfit.local" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="shroomfit" required>

      <p class="form-hint">Demo account: any non-empty password works.</p>
      <button class="primary" type="submit">Log in</button>
      <p id="login-message" class="form-message" role="alert"></p>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("login-message");

      if (!email || !password) {
        message.textContent = "Please enter an email and password.";
        return;
      }

      saveProfile({ email });
      localStorage.setItem(SESSION_KEY, "true");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
